<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/images/animated_java_icon.svg" />
		<meta name="viewport" content="width=device-width" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
		<script>
			// Hide admonition icons that fail to load. Registered before the page renders, since
			// image errors don't bubble and can fire before hydration.
			document.addEventListener(
				'error',
				event => {
					const target = event.target
					if (target instanceof HTMLImageElement && target.matches('.admonition-icon')) {
						target.hidden = true
					}
				},
				true
			)
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
